name: Deploy Sensor Updates
on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Gather Binaries
        run: |
          mkdir -p release_assets
          # Finds all .hex files and copies them to a flat folder for release
          find . -name "*.hex" -exec cp {} release_assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.hex
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
